<svg width="600" height="140" viewBox="0 0 600 140" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Logo JM Publicity Sound - versión horizontal para header</title>
<desc>Audífonos con las letras JM en degradado morado a rosa a la izquierda, con el texto Publicity Sound al lado en degradado, y un pequeño ecualizador de acento.</desc>
<defs>
<linearGradient id="metalH" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#f1f5f9"/>
<stop offset="50%" stop-color="#94a3b8"/>
<stop offset="100%" stop-color="#e2e8f0"/>
</linearGradient>
<linearGradient id="jmH" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#7c3aed"/>
<stop offset="100%" stop-color="#ec4899"/>
</linearGradient>
<linearGradient id="textH" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#7c3aed"/>
<stop offset="50%" stop-color="#ec4899"/>
<stop offset="100%" stop-color="#f97316"/>
</linearGradient>
<linearGradient id="eqH" x1="0" y1="1" x2="0" y2="0">
<stop offset="0%" stop-color="#f97316"/>
<stop offset="100%" stop-color="#ec4899"/>
</linearGradient>
</defs>

<path d="M 20 55 A 42 42 0 0 1 104 55" fill="none" stroke="url(#metalH)" stroke-width="8" stroke-linecap="round"/>
<rect x="12" y="50" width="14" height="34" rx="6" fill="url(#metalH)"/>
<rect x="98" y="50" width="14" height="34" rx="6" fill="url(#metalH)"/>
<rect x="15" y="55" width="8" height="24" rx="3" fill="#1e293b"/>
<rect x="101" y="55" width="8" height="24" rx="3" fill="#1e293b"/>

