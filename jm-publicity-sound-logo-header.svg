<line x1="132" y1="30" x2="132" y2="110" stroke="#3f2a5c" stroke-width="1.5"/>

<text x="152" y="63" font-size="26" font-weight="700" fill="url(#textH)" font-family="Arial, sans-serif">PUBLICITY</text>
<text x="152" y="93" font-size="26" font-weight="700" fill="url(#textH)" font-family="Arial, sans-serif">SOUND</text>

